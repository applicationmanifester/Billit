<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billit Favicon">
  <!-- Gradient Background for a premium feel -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" /> <!-- Yellowish Gold -->
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" /> <!-- Dark Orange -->
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="64" height="64" rx="16" fill="url(#brandGradient)"/>
  
  <!-- "B" initial in a bold, clean style -->
  <text x="32" y="44" 
        text-anchor="middle" 
        font-size="42" 
        font-family="'Inter', sans-serif, Arial" 
        font-weight="900" 
        fill="#FFFFFF"
        style="text-shadow: 0px 2px 4px rgba(0,0,0,0.2);">B</text>
</svg>
