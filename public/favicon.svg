<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Billit Logo with Tagline">
  <!-- Yellow Background with Curved Edges -->
  <rect width="100" height="100" rx="18" fill="#F7C733"/>
  
  <!-- Main Brand Name (Zoomed Out) -->
  <text id="brandName" x="50" y="54" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="28"
        letter-spacing="-1.2">
    <tspan fill="#FF5411">Bill</tspan><tspan fill="#000000">it</tspan>
  </text>
  
  <!-- Tagline matched exactly to the width of 'Billit' (Reduced Gap) -->
  <text x="50" y="65" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="5.5"
        fill="#000000"
        textLength="58"
        lengthAdjust="spacingAndGlyphs">Professional Billing App</text>
</svg>
